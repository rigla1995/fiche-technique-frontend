server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Assets fingerprintés (hash Vite dans le nom de fichier) : cache long immuable.
    # index.html reste sans cache long — c'est lui qui référence les nouveaux hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html : toujours revalidé, pour qu'un rechargement prenne la version déployée
    # (c'est lui qui référence les fichiers hachés de /assets/).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Lecture de la patente (espace admin) : fichiers de la reconnaissance de caractères et décodeurs de pdf.js, à
    # adresse fixe. Revalidés à chaque usage (jamais de fichier périmé après une mise à jour) ; un fichier absent
    # répond 404 — pas la page de l'application, que le lecteur prendrait pour le fichier.
    location /ocr/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /pdf-wasm/ {
        types { application/wasm wasm; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70">
  <defs>
    <!-- Icon background gradient (local space inside scale group) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Subtle lift on white letters -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5"
        flood-color="#000" flood-opacity="0.18"/>
    </filter>

    <!-- Wordmark gradient: same spectrum, horizontal, root coords -->
    <linearGradient id="wm" x1="82" y1="0" x2="268" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark: gradient bg + white LF, scaled 60 % ── -->
  <g transform="translate(5,5) scale(0.6)">
    <rect width="100" height="100" rx="22" fill="url(#bg)"/>

    <g filter="url(#lift)">
      <!-- L -->
      <rect x="13" y="22" width="13" height="56" rx="6.5" fill="white"/>
      <rect x="13" y="65" width="29" height="13" rx="6.5" fill="white"/>
      <!-- F -->
      <rect x="46" y="22" width="13" height="56" rx="6.5" fill="white"/>
      <rect x="46" y="22" width="41" height="13" rx="6.5" fill="white"/>
      <rect x="46" y="43" width="31" height="13" rx="6.5" fill="white"/>
    </g>
  </g>

  <!-- Separator: thin gradient line, same spectrum -->
  <line x1="74" y1="12" x2="74" y2="58" stroke="url(#wm)" stroke-width="1.5" opacity="0.35"/>

  <!-- Wordmark: "Lab" extra-bold + "Flow" light, gradient fill -->
  <text x="83" y="48"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="36"
    fill="url(#wm)">
    <tspan font-weight="800" letter-spacing="-1">Lab</tspan><tspan font-weight="300" letter-spacing="2">Flow</tspan>
  </text>
</svg>

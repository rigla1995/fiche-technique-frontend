<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70">
  <defs>
    <!-- Icon arc gradients (userSpaceOnUse = local coords inside the scale group) -->
    <linearGradient id="gl" x1="24" y1="76" x2="50" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gr" x1="50" y1="20" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gb" x1="24" y1="76" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Wordmark gradient: mirrors header left→right (indigo → sky-blue → purple) -->
    <linearGradient id="wm" x1="86" y1="0" x2="268" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="45%"  stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark (favicon scaled 60%, top-left) ── -->
  <g transform="translate(5,5) scale(0.6)">
    <rect width="100" height="100" rx="20" fill="#1e1b4b"/>

    <!-- Flow arcs -->
    <path d="M 24,76 C 14,48 28,20 50,20"
      fill="none" stroke="url(#gl)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 50,20 C 72,20 86,48 76,76"
      fill="none" stroke="url(#gr)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 24,76 C 42,87 58,87 76,76"
      fill="none" stroke="url(#gb)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

    <!-- Nodes -->
    <circle cx="50" cy="20" r="10" fill="white"/>
    <circle cx="24" cy="76" r="8" fill="#0ea5e9"/>
    <circle cx="76" cy="76" r="8" fill="#a855f7"/>
    <circle cx="50" cy="20" r="4" fill="#818cf8"/>
  </g>

  <!-- ── Thin separator ── -->
  <line x1="76" y1="14" x2="76" y2="56" stroke="#6366f1" stroke-width="1" opacity="0.25"/>

  <!-- ── Wordmark: "Lab" bold + "Flow" light, shared indigo→blue→purple gradient ── -->
  <text x="86" y="48"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="36"
    fill="url(#wm)">
    <tspan font-weight="800" letter-spacing="-0.8">Lab</tspan><tspan font-weight="300" letter-spacing="1.5">Flow</tspan>
  </text>
</svg>

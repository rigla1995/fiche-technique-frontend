<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 52">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="52%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ic">
      <rect x="-15.56" y="-15.56" width="31.12" height="31.12" rx="5.8"
            transform="translate(26,26) rotate(45)"/>
    </clipPath>
  </defs>

  <!-- Icône losange -->
  <g clip-path="url(#ic)">
    <rect x="0" y="0" width="52" height="52" fill="url(#bg)"/>
    <rect x="0" y="0" width="52" height="52" fill="url(#sh)"/>
  </g>
  <rect x="-15.56" y="-15.56" width="31.12" height="31.12" rx="5.8"
        transform="translate(26,26) rotate(45)"
        fill="none" stroke="white" stroke-opacity="0.25" stroke-width="0.6"/>

  <!-- Monogramme LF (scale=52/100=0.52 des coords favicon) -->
  <g transform="translate(26,26) rotate(45)" fill="white">
    <rect x="-6.71" y="-4.78" width="2.96" height="13.10" rx="1.09"/>
    <rect x="-6.71" y="5.41"  width="9.88"  height="2.96" rx="1.09"/>
    <rect x="3.74"  y="-8.32" width="2.96"  height="16.64" rx="1.09"/>
    <rect x="-6.71" y="-8.32" width="13.41" height="2.96"  rx="1.09"/>
    <rect x="-1.30" y="-1.20" width="8.00"  height="2.96"  rx="1.09"/>
  </g>

  <!-- Wordmark -->
  <text y="33"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="26" fill="white">
    <tspan x="62" font-weight="700" letter-spacing="-0.3">Lab</tspan><tspan font-weight="300" letter-spacing="1.5">Flow</tspan>
  </text>
</svg>
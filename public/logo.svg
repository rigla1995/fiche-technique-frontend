<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Icon: white rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="white"/>

  <!-- L -->
  <path d="M 18,16 L 18,50 Q 18,54 22,54 L 34,54"
    fill="none" stroke="url(#grad)" stroke-width="3.2"
    stroke-linecap="square" stroke-linejoin="round"/>

  <!-- F -->
  <path d="M 44,54 L 44,16 L 58,16 Q 61,16 61,19"
    fill="none" stroke="url(#grad)" stroke-width="3.2"
    stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M 44,33 L 58,33"
    fill="none" stroke="url(#grad)" stroke-width="3.2"
    stroke-linecap="square"/>

  <!-- Wordmark -->
  <text x="76" y="44"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="32"
    fill="white">
    <tspan font-weight="800" letter-spacing="-0.5">Lab</tspan><tspan font-weight="300" letter-spacing="1.5">Flow</tspan>
  </text>
</svg>

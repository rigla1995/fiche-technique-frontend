<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Icon mark -->
  <g transform="translate(2,2) scale(0.657)">
    <rect width="100" height="100" rx="22" fill="url(#bg)"/>
    <!-- Bold L -->
    <path d="M 21,22 L 21,74 L 43,74"
      fill="none" stroke="white" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bold F -->
    <path d="M 57,74 L 57,22 L 79,22"
      fill="none" stroke="white" stroke-width="8"
      stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="57" y1="48" x2="76" y2="48"
      stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="83" y="48"
    font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="34"
    fill="white">
    <tspan font-weight="700" letter-spacing="-0.5">Lab</tspan><tspan font-weight="300" letter-spacing="2">Flow</tspan>
  </text>
</svg>

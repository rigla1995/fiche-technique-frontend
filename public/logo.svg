<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70">
  <defs>
    <!-- Icon gradient: local space inside the scale group -->
    <linearGradient id="g" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="52%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Neon glow -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wordmark gradient (root coordinates) -->
    <linearGradient id="wm" x1="82" y1="0" x2="270" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="45%"  stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark: pill LF with neon glow, scaled 60% ── -->
  <g transform="translate(5,5) scale(0.6)">
    <rect width="100" height="100" rx="20" fill="#0f1117"/>

    <g filter="url(#glow)">
      <!-- L -->
      <rect x="12" y="21" width="14" height="58" rx="7" fill="url(#g)"/>
      <rect x="12" y="65" width="32" height="14" rx="7" fill="url(#g)"/>
      <!-- F -->
      <rect x="44" y="21" width="14" height="58" rx="7" fill="url(#g)"/>
      <rect x="44" y="21" width="44" height="14" rx="7" fill="url(#g)"/>
      <rect x="44" y="41" width="34" height="14" rx="7" fill="url(#g)"/>
    </g>
  </g>

  <!-- Separator -->
  <line x1="74" y1="13" x2="74" y2="57" stroke="#818cf8" stroke-width="1" opacity="0.3"/>

  <!-- Wordmark: "Lab" bold + "Flow" light, shared gradient -->
  <text x="82" y="48"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="36"
    fill="url(#wm)">
    <tspan font-weight="800" letter-spacing="-0.8">Lab</tspan><tspan font-weight="300" letter-spacing="1.5">Flow</tspan>
  </text>
</svg>

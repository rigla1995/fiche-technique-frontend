<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70">
  <defs>
    <!-- Header gradient for icon accent and wordmark -->
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Wordmark gradient spans x=82..270 in the logo coordinate space -->
    <linearGradient id="wm" x1="82" y1="0" x2="270" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="45%"  stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- ── Icon mark: LF monogram scaled at 60%, positioned (5,5)→(65,65) ── -->
  <g transform="translate(5,5) scale(0.6)">
    <rect width="100" height="100" rx="20" fill="#1e1b4b"/>

    <!-- Letter L -->
    <rect x="12" y="18" width="11" height="54" rx="3" fill="white"/>
    <rect x="12" y="61" width="30" height="11" rx="3" fill="white"/>

    <!-- Letter F -->
    <rect x="58" y="18" width="11" height="54" rx="3" fill="white"/>
    <rect x="58" y="18" width="30" height="11" rx="3" fill="white"/>
    <rect x="58" y="42" width="22" height="11" rx="3" fill="white"/>

    <!-- Gradient accent line -->
    <line x1="12" y1="81" x2="88" y2="81"
      stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ── Thin separator ── -->
  <line x1="74" y1="13" x2="74" y2="57" stroke="#6366f1" stroke-width="1" opacity="0.25"/>

  <!-- ── Wordmark: "Lab" bold + "Flow" light, shared header gradient ── -->
  <text x="82" y="48"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="36"
    fill="url(#wm)">
    <tspan font-weight="800" letter-spacing="-0.8">Lab</tspan><tspan font-weight="300" letter-spacing="1.5">Flow</tspan>
  </text>
</svg>

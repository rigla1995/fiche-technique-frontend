<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70">

  <!-- ── Icon mark (favicon scaled at 60%, positioned left) ── -->
  <g transform="translate(5,5) scale(0.6)">
    <!-- Background rounded square -->
    <rect width="100" height="100" rx="18" fill="#0e7490"/>

    <!-- Precision gauge ring: 300° arc, gap at bottom -->
    <path d="M 66,77.7 A 32,32 0 1,0 34,77.7"
      fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>

    <!-- Major tick marks -->
    <line x1="50" y1="15" x2="50" y2="23" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="85" y1="50" x2="77" y2="50" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="15" y1="50" x2="23" y2="50" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Minor ticks -->
    <line x1="74.4" y1="25.6" x2="70.1" y2="29.9" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="25.6" y1="25.6" x2="29.9" y2="29.9" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

    <!-- S-curve flow wave -->
    <path d="M 20,50 C 29,28 43,28 50,50 C 57,72 71,72 80,50"
      fill="none" stroke="white" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Data-point nodes -->
    <circle cx="20" cy="50" r="4.5" fill="#7dd3fc"/>
    <circle cx="80" cy="50" r="4.5" fill="#7dd3fc"/>

    <!-- Center inflection dot -->
    <circle cx="50" cy="50" r="2.5" fill="white" opacity="0.5"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- Visual separator: thin vertical rule between icon and text -->
  <line x1="75" y1="16" x2="75" y2="54" stroke="#0e7490" stroke-width="1" opacity="0.25"/>

  <!-- "Lab" — extra-bold, tight tracking, anchoring weight -->
  <text
    x="86"
    y="48"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="-0.8"
    fill="#0e7490">Lab</text>

  <!-- "Flow" — light weight, open tracking, flowing energy -->
  <!-- "Lab" at size 36 bold ≈ 69px wide; start "Flow" at 86+69=155 -->
  <text
    x="152"
    y="48"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="36"
    font-weight="300"
    letter-spacing="1.5"
    fill="#06b6d4">Flow</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient left arc: sky-blue → indigo -->
    <linearGradient id="gl" x1="24" y1="76" x2="50" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <!-- Gradient right arc: indigo → purple -->
    <linearGradient id="gr" x1="50" y1="20" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <!-- Gradient bottom arc: sky-blue → purple -->
    <linearGradient id="gb" x1="24" y1="76" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background: deep indigo, matches header dark anchor -->
  <rect width="100" height="100" rx="20" fill="#1e1b4b"/>

  <!-- Flow arcs (drawn before nodes so nodes sit on top) -->
  <!-- Left arc: input → central lab node -->
  <path d="M 24,76 C 14,48 28,20 50,20"
    fill="none" stroke="url(#gl)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Right arc: central lab node → output -->
  <path d="M 50,20 C 72,20 86,48 76,76"
    fill="none" stroke="url(#gr)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Bottom arc: subtle base connection -->
  <path d="M 24,76 C 42,87 58,87 76,76"
    fill="none" stroke="url(#gb)" stroke-width="4" stroke-linecap="round" opacity="0.45"/>

  <!-- Nodes -->
  <!-- Central lab node (top): white, largest — the precision measurement point -->
  <circle cx="50" cy="20" r="10" fill="white"/>
  <!-- Input node (bottom-left): sky blue -->
  <circle cx="24" cy="76" r="8" fill="#0ea5e9"/>
  <!-- Output node (bottom-right): purple -->
  <circle cx="76" cy="76" r="8" fill="#a855f7"/>

  <!-- Inner dots to suggest data/precision -->
  <circle cx="50" cy="20" r="4" fill="#818cf8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!--
    Raffiné & Stylé — trois niveaux de lecture :
    1. Le cercle-sceau  : cadre fin, comme une bague chevalière ou un gravé sur verre
    2. Les lettres L+F  : trait mince et constant, terminaisons droites "carré"
       L → angle bas-gauche arrondi (comme dans le sketch original)
       F → arche quart-de-cercle au sommet (pas de barre droite)
    3. Deux micro-points aux pôles du cercle : signature de précision
  -->

  <!-- Seal ring -->
  <circle cx="50" cy="50" r="39"
    fill="none" stroke="white" stroke-width="1.2" opacity="0.55"/>

  <!-- Precision marker dots at top and bottom of ring -->
  <circle cx="50" cy="11"  r="1.8" fill="white" opacity="0.55"/>
  <circle cx="50" cy="89"  r="1.8" fill="white" opacity="0.55"/>

  <!-- ── Letter "L" ──
       Vertical stroke + rounded bottom-left corner + horizontal bar
  ── -->
  <path d="M 26,24 L 26,69 Q 26,74 31,74 L 44,74"
    fill="none" stroke="white" stroke-width="3.2"
    stroke-linecap="square" stroke-linejoin="round"/>

  <!-- ── Letter "F" ──
       Vertical + quarter-circle arch at top (arch center = (58,44))
       + middle horizontal bar
  ── -->
  <path d="M 58,74 L 58,24 A 20,20 0 0,1 78,44"
    fill="none" stroke="white" stroke-width="3.2"
    stroke-linecap="square" stroke-linejoin="round"/>
  <path d="M 58,44 L 74,44"
    fill="none" stroke="white" stroke-width="3.2"
    stroke-linecap="square"/>
</svg>

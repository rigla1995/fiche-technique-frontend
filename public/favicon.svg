<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Full-width gradient sampling from left (blue) to right (purple) -->
    <!-- Same spectrum as the app header -->
    <linearGradient id="g" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="52%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background: deep indigo -->
  <rect width="100" height="100" rx="20" fill="#1e1b4b"/>

  <!-- ── Letter "L" ── -->
  <!-- Vertical stroke -->
  <rect x="13" y="18" width="10" height="55" rx="3" fill="url(#g)"/>
  <!-- Short bottom bar — transitions into the arc -->
  <rect x="13" y="63" width="24" height="10" rx="3" fill="url(#g)"/>

  <!-- ── The "Flow" arc ──────────────────────────────────────────
       This single curve does two things at once:
         1. Bridges from the end of L's horizontal bar (lower-left)
         2. Arrives as the middle bar of F (center-right)
       The joining trick is the creative "LabFlow" read.
  ─────────────────────────────────────────────────────────────── -->
  <path d="M 37,68 C 50,68 50,48 60,48"
    fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/>

  <!-- ── Letter "F" ── -->
  <!-- Vertical stroke -->
  <rect x="60" y="18" width="10" height="55" rx="3" fill="url(#g)"/>
  <!-- Top horizontal bar only — arc IS the mid bar -->
  <rect x="60" y="18" width="28" height="10" rx="3" fill="url(#g)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Header gradient: sky-blue → indigo → purple -->
    <linearGradient id="accent" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background: deep indigo (matches header dark anchor) -->
  <rect width="100" height="100" rx="20" fill="#1e1b4b"/>

  <!-- ── Letter "L" ── -->
  <!-- Vertical stroke -->
  <rect x="12" y="18" width="11" height="54" rx="3" fill="white"/>
  <!-- Horizontal stroke (bottom) -->
  <rect x="12" y="61" width="30" height="11" rx="3" fill="white"/>

  <!-- ── Letter "F" ── -->
  <!-- Vertical stroke -->
  <rect x="58" y="18" width="11" height="54" rx="3" fill="white"/>
  <!-- Top horizontal bar -->
  <rect x="58" y="18" width="30" height="11" rx="3" fill="white"/>
  <!-- Middle horizontal bar (shorter, at ~55% cap height) -->
  <rect x="58" y="42" width="22" height="11" rx="3" fill="white"/>

  <!-- Gradient accent: the "flow" element tying the two letters together -->
  <line x1="12" y1="81" x2="88" y2="81"
    stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
</svg>

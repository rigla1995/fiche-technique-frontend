<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Header gradient left→right across the full icon -->
    <linearGradient id="g" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="52%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background: deep indigo -->
  <rect width="100" height="100" rx="20" fill="#1e1b4b"/>

  <!-- ── Letter "L" ──
       Vertical stroke → rounded bottom-left corner → horizontal bar
       Corner: Q control at (16,80) creates a smooth 90° sweep
  ── -->
  <path d="M 16,17 L 16,73 Q 16,80 23,80 L 44,80"
    fill="none" stroke="url(#g)"
    stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── Letter "F" ──
       The top bar is a quarter-circle arch instead of a straight bar.
       Arch: center at (60,43), radius 26 → from (60,17) to (86,43)
       This gives a clean rounded cap matching the sketch.
  ── -->
  <!-- Vertical stroke + arch (one continuous path) -->
  <path d="M 60,80 L 60,17 A 26,26 0 0,1 86,43"
    fill="none" stroke="url(#g)"
    stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle horizontal bar -->
  <path d="M 60,43 L 82,43"
    fill="none" stroke="url(#g)"
    stroke-width="9" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0ea5e9"/>
      <stop offset="50%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="100" height="100" rx="26" fill="url(#bg)"/>

  <!--
    LF ligature — single flowing mark:
    Left arm (L): vertical down + round bottom-left corner + right horizontal base
    Right arm (F): vertical up from same base level + top-right bar + mid bar
    Both letters share the same baseline, connected as a unified mark.
  -->

  <!-- L -->
  <path d="M 20 22 L 20 71 Q 20 79 28 79 L 44 79"
    fill="none" stroke="white" stroke-width="9"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- F vertical + top bar -->
  <path d="M 57 79 L 57 22 L 80 22"
    fill="none" stroke="white" stroke-width="9"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- F middle bar -->
  <line x1="57" y1="49" x2="77" y2="49"
    stroke="white" stroke-width="9" stroke-linecap="round"/>
</svg>
